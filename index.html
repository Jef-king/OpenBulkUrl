<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#2aa87e">
    <meta name="description" content="OpenBulkUrl is a fast browser tool that lets you paste multiple website links and open them all in bulk with one click.">
    <meta name="keywords" content="bulk URL opener, open multiple links, website link opener, browser productivity tool, open tabs from list, URL list tool">
    <meta name="author" content="OpenBulkUrl">
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1">
    <meta name="format-detection" content="telephone=no">
    <meta property="og:type" content="website">
    <meta property="og:locale" content="en_US">
    <meta property="og:title" content="OpenBulkUrl | Open Multiple Links in Bulk">
    <meta property="og:description" content="Paste one URL per line and launch all your links in just one click with OpenBulkUrl.">
    <meta property="og:image" content="https://images.unsplash.com/photo-1522202176988-66273c2fd55f?auto=format&fit=crop&w=1200&q=80">
    <meta property="og:url" content="https://jef-king.github.io/OpenBulkUrl/">
    <meta property="og:site_name" content="OpenBulkUrl">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="OpenBulkUrl | Open Multiple Links in Bulk">
    <meta name="twitter:description" content="Paste one URL per line and launch all your links in just one click with OpenBulkUrl.">
    <meta name="twitter:image" content="https://images.unsplash.com/photo-1522202176988-66273c2fd55f?auto=format&fit=crop&w=1200&q=80">
    <link rel="canonical" href="https://jef-king.github.io/OpenBulkUrl/">
    <title>OpenBulkUrl | Open Multiple Links in Bulk</title>
    <link rel="stylesheet" href="styles.css">
    <script type="application/ld+json">
        {
          "@context": "https://schema.org",
          "@type": "WebApplication",
          "name": "OpenBulkUrl",
          "applicationCategory": "BrowserApplication",
          "operatingSystem": "Any",
          "description": "A simple tool to paste multiple links and open them all in new browser tabs with one click.",
          "url": "https://jef-king.github.io/OpenBulkUrl/",
          "offers": {
            "@type": "Offer",
            "price": "0",
            "priceCurrency": "USD"
          },
          "browserRequirements": "Requires modern web browser",
          "featureList": [
            "Paste one URL per line",
            "Open multiple tabs instantly",
            "Auto-adds https to URLs",
            "Light and dark theme toggle"
          ]
        }
    </script>
</head>
<body>
    <main class="app">
        <header class="intro">
            <div class="title-row">
                <div>
                    <p class="eyebrow">A faster way to browse</p>
                    <h1>OpenBulkUrl</h1>
                </div>
                <button type="button" id="themeToggle" class="theme-toggle" aria-label="Toggle light and dark mode">
                    <span class="toggle-icon" aria-hidden="true">☀️</span>
                    <span class="toggle-text">Light</span>
                </button>
            </div>
            <p class="subtitle">Turn a list of links into an open tab set. Paste one URL per line and let your browser do the busywork.</p>
        </header>

        <section class="workspace" aria-labelledby="url-label">
            <label class="field-label" id="url-label" for="urlInput">
                <span>Your URLs</span>
                <span id="count">0 links</span>
            </label>
            <textarea id="urlInput" rows="10" placeholder="Paste one URL per line"></textarea>
            <div class="actions">
                <span class="hint">One link per line · Ctrl + Enter to open</span>
                <button type="button" id="openButton"><span class="arrow" aria-hidden="true">↗</span> Open URLs</button>
            </div>
            <p id="status" role="status" aria-live="polite"></p>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
